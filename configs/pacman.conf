#
# Pacman configuration for the omarchy-mx-mac-iso build container.
#
# Repositories mirror what a prepared Asahi Arch Minimal system has, plus
# [asahi-alarm]. The mirror uses plain http: mirror.archlinuxarm.org does not
# serve valid TLS. Package integrity for the signed asahi-quattro bundle is
# enforced by builder/verify-channel.sh (GPG + sha256), so local files are
# accepted with LocalFileSigLevel = Optional.
#

[options]
HoldPkg = pacman glibc
Architecture = auto
CheckSpace
ParallelDownloads = 5
# The builder container cannot provide pacman's Landlock/alpm sandbox.
DisableSandbox
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[asahi-alarm]
SigLevel = Required DatabaseOptional
Server = https://github.com/asahi-alarm/asahi-alarm/releases/download/$arch

[core]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[extra]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[alarm]
Server = http://mirror.archlinuxarm.org/$arch/$repo

[aur]
Server = http://mirror.archlinuxarm.org/$arch/$repo
