# GRUB configuration embedded in BOOTAA64.EFI.
#
# Keep this tiny: the real menu lives in /grub/grub.cfg on the ESP, so
# cmdline experiments never require rebuilding the EFI binary. The embedded
# part only finds the ESP — via /omarchy-usb-live, a marker file that only
# exists on our live medium — and hands over.

search --no-floppy --file /omarchy-usb-live --set=root
configfile /grub/grub.cfg
