# mkinitcpio configuration for the Omarchy MX Mac live image.
#
# The module list is explicit on purpose: the packaged asahi hook is stale
# (adds dwc3-of-simple, never dwc3-apple) and USB storage only works when
# dwc3-apple and the display-crossbar mux bind in early userspace.

MODULES=(
  btrfs
  vfat
  loop
  dwc3-apple
  dwc3
  phy-apple-atc
  mux-apple-display-crossbar
  tps6598x
  typec
  xhci-plat-hcd
  xhci-hcd
  usb-storage
  uas
)

HOOKS=(base udev asahi omarchy-live)

COMPRESSION="zstd"
