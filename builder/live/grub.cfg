# GRUB configuration embedded in the live ESP's standalone EFI binary.
#
# grub-mkstandalone ships every module inside the memdisk but auto-loads
# only what commands pull in — filesystem and partition drivers must be
# insmod'ed explicitly or search finds nothing but the memdisk itself.
#
# The second entry exists so a suspect kernel cmdline (fw_devlink on t8112,
# for one) can be A/B tested from the boot menu without reflashing.

set timeout=5
set default=0

insmod part_gpt
insmod fat
insmod search_fs_file
insmod linux

menuentry "Omarchy MX Mac (live installer)" {
    search --no-floppy --file /EFI/BOOT/BOOTAA64.EFI --set=root
    linux ($root)/vmlinuz-linux-asahi rw systemd.unit=omarchy-mx-mac-install.target quiet
    initrd ($root)/initramfs-linux-asahi.img
}

menuentry "Omarchy MX Mac (fw_devlink=permissive)" {
    search --no-floppy --file /EFI/BOOT/BOOTAA64.EFI --set=root
    linux ($root)/vmlinuz-linux-asahi rw systemd.unit=omarchy-mx-mac-install.target quiet fw_devlink=permissive
    initrd ($root)/initramfs-linux-asahi.img
}
