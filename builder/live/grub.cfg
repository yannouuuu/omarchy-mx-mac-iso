# GRUB menu living on the USB ESP as /grub/grub.cfg — edit it there to try
# different kernel cmdlines without reflashing.

set timeout=5
set default=0

echo '======================================='
echo '  Omarchy MX Mac live USB'
echo '======================================='

search --no-floppy --file /omarchy-usb-live --set=root

menuentry 'Omarchy MX Mac (live installer)' {
    linux /vmlinuz-linux-asahi rw systemd.unit=omarchy-mx-mac-install.target quiet
    initrd /initramfs-linux-asahi.img
}

menuentry 'Omarchy MX Mac (fw_devlink=permissive)' {
    linux /vmlinuz-linux-asahi rw systemd.unit=omarchy-mx-mac-install.target quiet fw_devlink=permissive
    initrd /initramfs-linux-asahi.img
}

if [ -f /grub/custom.cfg ]; then
    source /grub/custom.cfg
fi
